name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    # Everything used to run as four separate jobs (lint, typecheck, unit
    # matrix legs, plus a standalone integration job), each claiming its own
    # GitHub-hosted runner. With several PRs open at once that saturated this
    # account's concurrent-runner cap and left jobs sitting `queued` for
    # 10-20+ minutes with zero billable compute -- never actually starting,
    # just waiting on a slot. Collapsing to one job means one runner request
    # per push/PR instead of four, which is the actual fix for the
    # contention; it costs matrix parallelism (lint/typecheck/unit now run
    # sequentially instead of side by side), a reasonable trade against
    # everything queuing indefinitely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise (reads .mise.toml for the pinned Node version)
        uses: jdx/mise-action@v2

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      # Fork PRs don't get repo secrets (GitHub withholds them by design), so
      # OPENROUTER_API_KEY would be empty there and every dispatch would fail on
      # auth rather than on anything the PR actually changed. Runs only for
      # same-repo pushes/PRs, where the secret is actually available.
      - name: Check integration eligibility
        id: integration_gate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      # Ubuntu's apt bubblewrap package reports a version >= 0.8 (the floor
      # sandbox.js's checkOverlaySupport() trusts) but is built with overlay
      # support (--overlay-src/--overlay) compiled out, so every sandboxed
      # dispatch fails with "bwrap: Unknown option --overlay-src". Build a
      # real overlay-capable bwrap from source instead. A plain unprivileged
      # build then hits Ubuntu 24.04's AppArmor unprivileged-userns
      # restriction ("bwrap: setting up uid map: Permission denied") -- and
      # unlike the apt package, this can't be worked around with setuid-root,
      # because bwrap itself refuses --overlay-src in setuid mode ("The
      # --overlay-src option is not permitted in setuid mode": overlay plus
      # setuid is a real privilege-escalation risk bwrap deliberately blocks).
      # So relax the AppArmor restriction instead and keep bwrap unprivileged
      # -- safe here since this is a fresh, throwaway CI VM, not a shared host.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        if: steps.integration_gate.outputs.run == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build bubblewrap (with overlay support) from source
        if: steps.integration_gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev pkg-config
          git clone --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bubblewrap-src
          cd /tmp/bubblewrap-src
          meson setup build -Dman=disabled
          ninja -C build
          sudo ninja -C build install
          bwrap --help | grep -q -- --overlay-src

      - name: Install opencode CLI
        if: steps.integration_gate.outputs.run == 'true'
        run: npm install -g opencode-ai

      # A fresh runner has no ~/.config/opencode, so opencode boots on its
      # stock defaults -- which include the built-in `title` agent. That agent
      # fires a second, separate model request per session purely to name the
      # session for the TUI's session list. Nothing in a headless CI dispatch
      # ever reads that name: the smoke tests drive `opencode run`, assert on
      # task state, and exit. So every session in the integration leg was
      # spending an extra billed OPENROUTER_API_KEY call, and taking an extra
      # chance at a 429 or a provider hiccup, to produce a string no one reads.
      # `agent.title.disable` is opencode's own config key for this
      # (Config.agent.title -> AgentConfig.disable in https://opencode.ai/config.json).
      #
      # This has to land in the real ~/.config/opencode rather than a repo-local
      # file because that is the directory executor.js's sandboxAuthFile()
      # read-only-binds into each sandboxed dispatch (src/executor.js) -- a
      # config written anywhere else is invisible inside the sandbox.
      - name: Disable opencode's title agent (no one reads a CI session's title)
        if: steps.integration_gate.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "agent": { "title": { "disable": true } }
          }
          JSON
          node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.config/opencode/opencode.json", "utf8"))'

      - name: Run integration (real CLI + daemon + live dispatch, no mocks)
        if: steps.integration_gate.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run test:integration
