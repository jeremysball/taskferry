name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run lint
        if: matrix.leg == 'lint'
        run: npm run lint

      - name: Run typecheck
        if: matrix.leg == 'typecheck'
        run: npm run typecheck

      - name: Run unit tests
        if: matrix.leg == 'unit'
        run: npm run test:unit

  integration:
    # Fork PRs don't get repo secrets (GitHub withholds them by design), so
    # MINIMAX_API_KEY would be empty there and every dispatch would fail on
    # auth rather than on anything the PR actually changed. Runs only for
    # same-repo pushes/PRs, where the secret is actually available.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Ubuntu's apt bubblewrap package reports a version >= 0.8 (the floor
      # sandbox.js's checkOverlaySupport() trusts) but is built with overlay
      # support (--overlay-src/--overlay) compiled out, so every sandboxed
      # dispatch fails with "bwrap: Unknown option --overlay-src". Build a
      # real overlay-capable bwrap from source instead.
      - name: Build bubblewrap (with overlay support) from source
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev pkg-config
          git clone --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bubblewrap-src
          cd /tmp/bubblewrap-src
          meson setup build -Dman=disabled
          ninja -C build
          sudo ninja -C build install
          bwrap --help | grep -q -- --overlay-src

      - name: Install pi CLI
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Run integration (real CLI + daemon + live dispatch, no mocks)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: npm run test:integration
